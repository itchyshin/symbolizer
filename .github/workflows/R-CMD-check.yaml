on:
  pull_request:
  workflow_dispatch:

name: R-CMD-check

jobs:
  R-CMD-check:
    runs-on: ubuntu-latest
    name: ubuntu-latest (release)
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check
      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          # Vignettes are NOT built/checked on CI: they fit heavy MCMC models
          # (brms / MCMCglmm) and emit PDF figures via as_pdf_three_views(),
          # which needs a TeX distribution the runner does not install. They are
          # built and checked locally (devtools::check / pkgdown) per the
          # repo's "local checks over CI" policy. CI keeps the fast, portable
          # R-code / docs / examples / tests checks.
          args: 'c("--no-manual", "--no-vignettes", "--as-cran")'
          build_args: 'c("--no-manual", "--no-build-vignettes")'
