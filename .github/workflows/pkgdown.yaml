on:
  push:
    branches: [main]
  workflow_dispatch:

name: pkgdown

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      # tinytex is needed for `as_pdf_three_views()` -- used by
      # vignettes/symbolizer-structural-dependence.Rmd to emit
      # downloadable PDF artefacts next to the rendered article.
      # Without this step the runner has no LaTeX, so pkgdown's
      # vignette build halts at the metafor-pdf chunk.
      - uses: r-lib/actions/setup-tinytex@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # BH (Boost headers) and RcppEigen are runtime deps of brms /
          # rstan that the runner image does not auto-install; without
          # them, structural-dependence.Rmd's brms-fit chunk halts the
          # build with "Boost not found".
          extra-packages: any::pkgdown, any::BH, any::RcppEigen, local::.
          needs: website
      - name: Move dev-log artefacts aside (tracked under docs/ but not pkgdown-built; clean_site() would refuse)
        run: |
          mkdir -p /tmp/symbolizer-devlog
          if [ -d docs/dev-log ]; then mv docs/dev-log /tmp/symbolizer-devlog/dev-log; fi
          if [ -d docs/specs   ]; then mv docs/specs   /tmp/symbolizer-devlog/specs;   fi
      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}
      - name: Restore dev-log artefacts alongside the pkgdown site
        run: |
          if [ -d /tmp/symbolizer-devlog/dev-log ]; then mv /tmp/symbolizer-devlog/dev-log docs/dev-log; fi
          if [ -d /tmp/symbolizer-devlog/specs   ]; then mv /tmp/symbolizer-devlog/specs   docs/specs;   fi
      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4.8.0
        with:
          clean: false
          branch: gh-pages
          folder: docs
