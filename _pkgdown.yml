url: https://itchyshin.github.io/symbolizer/

template:
  bootstrap: 5
  bootswatch: flatly
  # Render math with KaTeX (not pandoc's native MathML default, and not
  # MathJax). Native MathML brackets do not stretch around <mtable> in Chrome
  # (matrix blocks + three-views widgets) -- the original reason we left the
  # MathML default. We previously used MathJax, but its combined CDN bundle
  # (tex-mml-chtml) cannot autoload the `boldsymbol` extension ("No version
  # information available for component [tex]/boldsymbol"), so bold-Greek
  # vectors (\boldsymbol{\mu} etc.) in the matrix-notation equations rendered
  # as red raw text site-wide. KaTeX bundles \boldsymbol + stretchy delimiters
  # and renders every block at load (including the widgets' hidden tabs), so
  # the widgets' window.MathJax.typesetPromise() calls become harmless no-ops.
  math-rendering: katex
  bslib:
    # Reddish / brick primary so symbolizer is visually distinct from its
    # teal-themed sister packages (drmTMB, gllvmTMB use #0f7887).
    primary:    "#a0282b"
    secondary:  "#7a2a2a"
    success:    "#2d6a4f"
    info:       "#5b6770"
    code-color: "#7a2a2a"
    link-color: "#a0282b"
    headings-color: "#5a1819"

home:
  title: symbolizer
  description: >
    Structured symbolic specifications, interpretations, and teachable stories
    for modern statistical models in ecology and evolution.

navbar:
  structure:
    left:  [intro, articles, roadmap, reference, news]
    right: [search, github]
  components:
    roadmap:
      text: Roadmap
      href: articles/symbolizer-roadmap.html

articles:
  - title: "Get started"
    desc: "Start here: a five-minute quickstart, then the ladder that builds up from lm() to location-scale on one shared dataset."
    contents:
      - symbolizer
      - symbolizer-ladder
  - title: "Deep dives"
    desc: "One renderer or concept at a time: the drmTMB extractor, factor contrasts and interactions, non-Gaussian families, variance components, latent variables (gllvm), and structural model comparison."
    contents:
      - symbolizer-drmtmb
      - symbolizer-factors
      - symbolizer-families
      - symbolizer-variance-components
      - symbolizer-gllvm
      - symbolizer-compare
  - title: "Cross-package bridges"
    desc: "Models whose structure lives in another package: phylogenetic, animal-model, and spatial dependence, and meta-analysis across metafor / brms / MCMCglmm."
    contents:
      - symbolizer-structural-dependence
      - symbolizer-meta-analysis
  - title: "Where we're going"
    desc: "The capability roadmap: what is Stable, what is a First slice, and what is planned or reserved."
    contents:
      - symbolizer-roadmap

reference:
  - title: "Package"
    contents:
      - symbolizer-package
  - title: "First-time entry"
    desc: "One call that does it all, plus the plain-English summary of a symbolized_model."
    contents:
      - explain
      - summary.symbolized_model
  - title: "Teaching bundle (one-call)"
    desc: "model_card collects equation, assumptions, readings, extraction calls, recommended plots in one S3 object."
    contents:
      - model_card
  - title: "Build the structured symbolic object"
    desc: "The product. Renderers consume it; users override symbols, units, context here."
    contents:
      - symbolize
      - symbolize.drmTMB
      - symbolize.gllvmTMB
      - symbolize.glmmTMB
      - symbolize.brmsfit
      - symbolize.MCMCglmm
      - symbolize.lm
      - symbolize.glm
      - symbolize.lmerMod
      - symbolize.glmerMod
      - symbolize.sdmTMB
      - symbolize.rma.uni
      - symbolize.rma.mv
      - symbolize.gam
      - symbolize.phylolm
      - symbolizer_capabilities
  - title: "Read both notations"
    desc: "Educator-facing bridge between index and matrix forms."
    contents:
      - notation_bridge
  - title: "See the data flow"
    desc: "Numeric arrays behind the symbols, and the three-views widget — interactive HTML and static PDF."
    contents:
      - expand
      - as_html_three_views
      - as_pdf_three_views
  - title: "Render the equations"
    desc: "LaTeX surface. Lines come from the symbolized_model; renderers only choose the layout."
    contents:
      - equations
      - as_latex
  - title: "Render the tables"
    desc: "Symbols (with dimensions), assumptions (stated / implied / not checked), R-syntax-to-math bridge."
    contents:
      - symbol_table
      - assumption_table
      - formula_bridge
  - title: "Interpret the coefficients"
    desc: "Per-parameter readings on link, natural, variance, and biological scales."
    contents:
      - parameter_interpretation
  - title: "Marginal estimates"
    desc: "Per-group means and per-group slopes via emmeans, alongside the contrast rows."
    contents:
      - group_means
      - group_slopes
  - title: "Variance components"
    desc: "Where the variation lives, and how repeatable a trait is (ICC / repeatability)."
    contents:
      - variance_partition
      - icc
  - title: "Compare two models"
    desc: "Structural diff between two symbolized_model objects: which submodels, which terms, which assumption statuses differ."
    contents:
      - compare_symbolic
  - title: "Draft a Methods paragraph"
    desc: "Turn a symbolized_model into a draft Methods-section paragraph (opt-in, template-based, never LLM)."
    contents:
      - methods_text
  - title: "Per-fit warnings"
    desc: "Conditions symbolize() flagged when building the object (e.g., Wald CI with few RE groups). Templated from inst/extdata/warning-templates.csv."
    contents:
      - warning_table
  - title: "Model diagram"
    desc: "Render the structural model as a DAG (nodes for response, parameters, predictors, groups, random effects). Returns a list with DOT (GraphViz), Mermaid (Markdown / Quarto), and TikZ (LaTeX) representations."
    contents:
      - as_dag
  - title: "Simulation recipe"
    desc: "Pseudocode + runnable R code describing how to simulate from a fitted model."
    contents:
      - simulate_recipe
  - title: "Internal: term-grammar bridge"
    desc: "The R formula <-> model matrix <-> biological symbol layer that every renderer reads."
    contents:
      - extract_terms
      - get_parameterization
  - title: "Internal: capability registry"
    desc: "The gate deciding which (class, family, component) tuples symbolize() supports, plus the human-readable status words."
    contents:
      - capability_check
      - friendly_status
  - title: "Internal: template loader"
    desc: "Reads and caches the prose / LaTeX templates in inst/extdata/*.csv that every renderer draws from."
    contents:
      - load_template
      - clear_template_cache
  - title: "Internal: formula helpers"
    desc: "Low-level formula-parsing and LaTeX-environment utilities shared across the extractors and renderers."
    contents:
      - formula_lhs
      - formula_rhs
      - formula_vars
      - wrap_aligned
      - align_at
      - wrap_env
  - title: "Internal: object construction"
    desc: "S3 constructor and validator. Useful only for advanced users hand-building symbolized_model objects."
    contents:
      - new_symbolized_model
      - validate_symbolized_model
